name: science_adventure
description: My School Adventures, offline Year 1 science, maths and English for children and their parents.
publish_to: none
version: 0.6.4+12
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  flutter_tts: 4.2.5
  image_picker: 1.2.3
  path_provider: 2.1.6
  lottie: 3.6.1
  flame: 1.38.2
  logging: 1.3.0
  intl: 0.20.3
  drift: 2.35.2
  drift_flutter: 0.3.1
  sqlite3: 3.7.0
  http: 1.6.0
  flutter_secure_storage: 11.2.0
dev_dependencies:
  build_runner: 2.16.1
  drift_dev: 2.35.1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/catalog.json
    - assets/content/maths_catalog.json
    - assets/content/english_catalog.json
    # The school years and their subjects (ADR-0021).
    - assets/content/years.json
    # Arabic for the parent report's activities (teacher review 4, T4-5e).
    - assets/content/parent_ar.json
    - assets/content/playable/
    - assets/animations/celebrate.json
    - assets/images/bean-stages-v1.webp
    - assets/images/earth-atlas-v2.webp
    - assets/images/electric-atlas-v2.webp
    - assets/images/explorer-boy-v2.webp
    - assets/images/explorer-girl-v2.webp
    - assets/images/five-senses-v2.webp
    - assets/images/garden-v2.webp
    - assets/images/greenhouse-v1.webp
    - assets/images/home-hunt-v1.webp
    - assets/images/islands-v2.webp
    - assets/images/maths-islands-v2.webp
    - assets/images/maths-objects-v2.webp
    - assets/images/maths-backdrops-v2.webp
    - assets/images/maths-birds-v1.webp
    - assets/images/maths-things-v1.webp
    - assets/images/english-islands-v1.webp
    - assets/images/english-backdrops-v1.webp
    - assets/images/english-words-v1.webp
    - assets/images/english-scenes-v1.webp
    - assets/images/light-plants-v1.webp
    - assets/images/light-room-v1.webp
    - assets/images/materials-atlas-v2.webp
    - assets/images/physics-atlas-v1.webp
    - assets/images/plant-foods-v1.webp
    - assets/images/plant-lab-v1.webp
    - assets/images/river-hunt-v1.webp
    - assets/images/science-details-v2.webp
    - assets/images/science-extras-v1.webp
    - assets/images/sense-objects-v2.webp
    - assets/images/sound-atlas-v2.webp
    - assets/images/sound-details-v2.webp
    - assets/images/forces-objects-v4.webp
    - assets/images/forces-characters-v4.webp
    - assets/images/forces-details-v4.webp
    - assets/images/forces-garden-v6.webp
    - assets/images/book-v1.webp
    - assets/images/electric-safety-v1.webp
    # Socket rule: no hand near the socket, the child well away, one whole wall
    # and a socket that looks like one (reviews 4, 5, 6).
    - assets/images/electric-safety-socket-v4.webp
    - assets/images/water-world-v1.webp
    - assets/audio/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
