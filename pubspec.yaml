name: science_adventure
description: An offline science adventure for children and their parents.
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  flutter_tts: 4.2.5
  image_picker: 1.2.3
  path_provider: 2.1.6
  lottie: 3.6.1
  flame: 1.38.2
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/content/catalog.json
    - assets/content/playable/
    - assets/animations/celebrate.json
    - assets/images/
    - assets/audio/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
