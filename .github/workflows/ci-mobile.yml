name: ci-mobile

# To save Actions minutes: a branch with an open pull request is checked
# once (by the pull_request event, not again by its push), documentation-only
# changes are skipped, and the slow jobs (Windows goldens and the release
# builds) run only on main or when started by hand.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Toolchain matches .flutter-version
        run: |
          test "$(tr -d '[:space:]' < .flutter-version)" = "$FLUTTER_VERSION"
          flutter --version
      - name: Restore dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile
      - name: Generated code is up to date (Drift, l10n)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- lib
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test --exclude-tags golden,benchmark
      - name: Repository stays clean after tests
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Web platform tests (Chrome)
        run: flutter test --platform chrome test/web

  goldens:
    # Baselines in test/goldens were generated on Windows; compare on the
    # same OS so anti-aliasing differences cannot cause false failures.
    # Windows minutes bill double, so only on main or a manual run.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Golden (visual regression) tests
        run: flutter test --tags golden
      - name: Upload failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/goldens/failures/
          retention-days: 7

  content-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-content.txt
      - name: Validate playable lessons against the schema
        run: python scripts/validate_playable.py

  android-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Debug APK
        run: flutter build apk --debug
      - name: Ephemeral release key (verification only, never published)
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-verify.jks" -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-verify-only -keypass ci-verify-only \
            -dname "CN=CI verification only"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/ci-verify.jks
          storePassword=ci-verify-only
          keyAlias=ci
          keyPassword=ci-verify-only
          EOF
      - name: Release App Bundle (obfuscated)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
      - name: Release APK (obfuscated, per-ABI)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      # Internet is the only permission (parent accounts and sync, ADR-0002);
      # the device-only mode makes no network requests at all.
      - name: Only the internet permission in the release APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            perms=$("$AAPT2" dump permissions "$apk" | grep -E '^uses-permission' | grep -v 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' | grep -v "name='android.permission.INTERNET'" || true)
            if [ -n "$perms" ]; then echo "Unexpected permissions in $apk:"; echo "$perms"; exit 1; fi
          done
      - name: Build sizes
        run: |
          ls -l build/app/outputs/bundle/release/*.aab build/app/outputs/flutter-apk/*.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove ephemeral key material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/ci-verify.jks"

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Web target present?
        id: web
        run: echo "present=$([ -f web/index.html ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.web.outputs.present == 'true'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - if: steps.web.outputs.present == 'true'
        run: flutter pub get --enforce-lockfile
      - if: steps.web.outputs.present == 'true'
        run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run
      - name: Web bundle size
        if: steps.web.outputs.present == 'true'
        run: du -sh build/web | tee -a "$GITHUB_STEP_SUMMARY"
