# Web container: serves the Flutter web build and forwards /api to the API
# container. TLS ends at the Synology reverse proxy in front of it.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  types { application/wasm wasm; application/vnd.android.package-archive apk; }
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  charset utf-8;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Access log without query strings, cookies or IPs beyond the network part.
  map $remote_addr $ip_prefix {
    ~^(?<p>\d+\.\d+\.\d+)\.\d+$ $p.0;
    default -;
  }
  log_format privacy '$time_iso8601 $ip_prefix "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout privacy;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript text/javascript application/json application/wasm image/svg+xml font/otf font/ttf;

  # Extra brake in front of the API's own limits.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

  # Docker's DNS, re-resolved so a restarted API container (new address) is found.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $uri $download_disposition { ~\.apk$ attachment; default ""; }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
      limit_req zone=auth burst=40 nodelay;
      limit_req_status 429;
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }

    # The API's health probes stay inside the container network.
    location /health/ { return 404; }

    # Android app for the trial: the owner copies the signed APK here.
    location /download/ {
      alias /downloads/;
      autoindex off;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Disposition $download_disposition always;
    }

    # Engine files change only with a new Flutter version.
    location /canvaskit/ { add_header Cache-Control "public, max-age=604800" always; add_header X-Content-Type-Options nosniff always; }

    # Everything else is revalidated so an update reaches every browser at once.
    location / {
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
