include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: error
    # Async safety (AUD-013): a dropped Future hides failures.
    unawaited_futures: warning
    use_build_context_synchronously: warning
  exclude:
    - build/**
    - android/**
    - tmp/**
    - reports/_scratch/**
    - web/**

linter:
  rules:
    # Kept from the original rule set.
    - avoid_print
    - prefer_const_constructors
    - use_key_in_widget_constructors
    # Correctness and async safety (AUD-013).
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_void_async
    - only_throw_errors
    - always_declare_return_types
    - avoid_slow_async_io
    - throw_in_finally
    - unnecessary_statements
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - hash_and_equals
    # Readability that prevents real bugs.
    - curly_braces_in_flow_control_structures
    # avoid_dynamic_calls is enabled in M2 together with the typed models
    # (AUD-003): today 355 hits are untyped Map<String, dynamic> accesses.
