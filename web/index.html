<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`; the NAS serves the app at "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My School Adventures: Year 1 science and maths games for young children, played with a grown-up nearby.">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FFF8EC">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My School Adventures">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>My School Adventures</title>
  <!-- Everything is served from this site: no CDN, fonts or trackers. -->
  <style>
    html, body { margin: 0; height: 100%; background: #FFF8EC; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 600 18px/1.4 system-ui, sans-serif; color: #174F7F;
    }
    #loading img { width: 96px; height: 96px; }
    #loading .bar { width: 160px; height: 6px; border-radius: 3px; background: #E2DBCF; overflow: hidden; }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #2170B5;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #loading .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div>My School Adventures</div>
    <div lang="ar" dir="rtl">جاري التحميل…</div>
    <div class="bar"></div>
  </div>
  <noscript>My School Adventures needs JavaScript. • اللعبة محتاجة JavaScript.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
